services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cividle
      POSTGRES_PASSWORD: cividle_secret
      POSTGRES_DB: civilization_idle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cividle -d civilization_idle"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://cividle:cividle_secret@postgres:5432/civilization_idle
      PORT: 3001
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:-dev_bot_token_change_me}
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
